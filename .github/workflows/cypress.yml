name: Execução de Testes Cypress
on: [push] # Dispara a pipeline a cada push para o GitHub

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Rodar Testes do Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          # Removi a duplicação e deixei apenas o necessário

      - name: Upload Screenshots (se falhar)
        uses: actions/upload-artifact@v4
        if: failure() # Só roda se o passo acima der erro
        with:
          name: cypress-screenshots
          path: cypress/screenshots